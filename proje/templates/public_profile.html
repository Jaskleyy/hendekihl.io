{% extends "layout.html" %}

{% block title %}Sosyal Profil{% endblock %}

{% block extra_css %}
<style>
    .public-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 20px 20px 60px;
    }

    .public-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #334155;
        border-radius: 999px;
        padding: 10px 18px;
        text-decoration: none;
        font-weight: 700;
        margin-bottom: 20px;
        transition: 0.2s;
    }
    .public-back:hover { background: #f1f5f9; transform: translateX(-3px); }

    .public-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        box-shadow: 0 14px 40px -22px rgba(2, 6, 23, 0.15);
        overflow: hidden;
        position: relative;
    }

    .public-cover {
        height: 240px;
        background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
        background-size: cover;
        background-position: center;
    }

    .public-body {
        padding: 0 30px 30px;
        margin-top: -60px; /* Avatarı yukarı iter */
        position: relative;
    }

    .public-avatar {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 6px solid #fff;
        background-color: #dbeafe; /* Resim yoksa bu renk görünür */
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
        color: #1e3a8a;
        font-weight: 800;
        font-size: 2.5rem;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .public-top {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
        flex-wrap: wrap;
    }

    .public-name {
        margin: 0;
        color: #0f172a;
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        font-weight: 700;
        line-height: 1.1;
    }

    .public-user {
        color: #64748b;
        margin-top: 5px;
        font-size: 1rem;
        font-weight: 500;
    }

    .badge-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
        padding: 8px 16px;
        font-size: 0.9rem;
        font-weight: 800;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .public-fullname {
        margin-top: 15px;
        color: #334155;
        font-weight: 600;
        font-size: 1.1rem;
    }

    .public-grid {
        margin-top: 25px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
    }

    .public-chip {
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #f8fafc;
        padding: 15px;
        text-align: center;
    }

    .public-chip .k {
        color: #64748b;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .public-chip .v {
        color: #0f172a;
        font-weight: 800;
        font-size: 1.3rem;
    }

    .error-box {
        margin-top: 20px;
        border-radius: 12px;
        padding: 15px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        display: none;
        text-align: center;
        font-weight: 600;
    }

    @media (max-width: 640px) {
        .public-wrap { padding: 10px 15px 40px; }
        .public-cover { height: 180px; }
        .public-avatar { width: 100px; height: 100px; font-size: 2rem; margin-top: 0; }
        .public-body { margin-top: -50px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="public-wrap">
    <a class="public-back" href="/dashboard/social"><i class="fas fa-arrow-left"></i> Sosyal Alana Dön</a>

    <div class="public-card">
        <div id="pubCover" class="public-cover"></div>
        
        <div class="public-body">
            <div id="pubAvatar" class="public-avatar">
                <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem;"></i>
            </div>

            <div class="public-top">
                <div>
                    <h1 id="pubName" class="public-name">Yükleniyor...</h1>
                    <div id="pubUser" class="public-user">Lütfen bekleyin</div>
                </div>
                <div id="pubBadge" class="badge-chip"><i class="fas fa-medal"></i> ...</div>
            </div>

            <div id="pubFullname" class="public-fullname"></div>

            <div class="public-grid">
                <div class="public-chip">
                    <div class="k">Karbon Skoru</div>
                    <div id="pubScore" class="v">-</div>
                </div>
                <div class="public-chip">
                    <div class="k">Eğitim Seviyesi</div>
                    <div id="pubEdu" class="v">-</div>
                </div>
            </div>

            <div id="pubErr" class="error-box"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Flask'tan gelen ID'yi güvenli şekilde alıyoruz
    // Eğer ID gelmezse 0 kabul ediyoruz
    const targetUserId = Number("{{ target_user_id|default('0') }}");

    function initials(name) {
        const clean = String(name || "U").trim();
        return clean ? clean.slice(0, 1).toUpperCase() : "U";
    }

    function setBgImage(el, imageUrl, fallbackGradient) {
        if (!el) return;
        if (imageUrl && imageUrl !== "null" && imageUrl !== "None") {
            // Tırnak işaretlerini temizleyip URL'i koyuyoruz
            const safeUrl = String(imageUrl).replace(/"/g, '\\"');
            el.style.backgroundImage = `url("${safeUrl}")`;
            // Resim varsa içindeki yazıyı siliyoruz
            el.innerText = ""; 
        } else {
            // Resim yoksa varsayılan gradient veya renk kalsın
            if (fallbackGradient) el.style.background = fallbackGradient;
            el.style.backgroundImage = "none";
        }
    }

    function showErr(msg) {
        const box = document.getElementById("pubErr");
        box.style.display = "block";
        box.innerText = msg;
        
        document.getElementById("pubName").innerText = "Profil Bulunamadı";
        document.getElementById("pubUser").innerText = "";
    }

    async function loadPublicProfile() {
        if (!targetUserId || targetUserId === 0) {
            showErr("Geçersiz veya eksik profil ID'si.");
            return;
        }

        try {
            console.log("Profil çekiliyor ID:", targetUserId); // Debug için konsola bas
            const resp = await fetch(`/api/social/user/${targetUserId}`);
            
            if (!resp.ok) {
                const errData = await resp.json();
                showErr(errData.message || "Profil yüklenemedi (Sunucu Hatası).");
                return;
            }

            const data = await resp.json();

            // Verileri Yerleştir
            const displayName = data.display_name || data.nickname || data.username || "Kullanıcı";
            document.getElementById("pubName").innerText = displayName;
            document.getElementById("pubUser").innerText = `@${data.username}`;
            document.getElementById("pubBadge").innerHTML = `<i class="fas fa-medal"></i> ${data.badge.name || "Rookie"}`;
            
            document.getElementById("pubScore").innerText = `${Number(data.carbon_score || 0).toFixed(2)} kg`;
            document.getElementById("pubEdu").innerText = (data.education_level || "Belirtilmemiş").toUpperCase();
            document.getElementById("pubFullname").innerText = data.full_name || "";

            // Resimler
            const coverEl = document.getElementById("pubCover");
            const avatarEl = document.getElementById("pubAvatar");

            // Kapak
            setBgImage(coverEl, data.preview_media_url, "linear-gradient(135deg, #064e3b 0%, #10b981 100%)");

            // Avatar (Resim yoksa baş harf koy)
            if (data.avatar_url) {
                setBgImage(avatarEl, data.avatar_url, null);
            } else {
                avatarEl.style.backgroundImage = "none";
                avatarEl.style.backgroundColor = "#dbeafe";
                avatarEl.innerText = initials(displayName);
            }

        } catch (err) {
            console.error(err);
            showErr("Bağlantı hatası oluştu.");
        }
    }

    // Sayfa yüklenince çalıştır
    window.addEventListener('load', loadPublicProfile);
</script>
{% endblock %}
