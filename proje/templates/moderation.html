{% extends "layout.html" %}
{% block title %}Moderasyon{% endblock %}

{% block extra_css %}
<style>
    .mod-wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px;
    }
    .mod-head {
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }
    .mod-title {
        margin: 0;
        color: #064e3b;
        font-size: 2rem;
        font-family: "Playfair Display", serif;
    }
    .mod-sub {
        margin: 4px 0 0;
        color: #64748b;
        font-size: 0.92rem;
    }
    .mod-btn {
        border: 1px solid #d1d5db;
        background: #fff;
        color: #0f172a;
        border-radius: 6px;
        font-weight: 700;
        padding: 8px 12px;
        cursor: pointer;
    }
    .mod-list {
        display: grid;
        gap: 12px;
    }
    .mod-card {
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 8px;
        padding: 14px;
    }
    .mod-post-title {
        margin: 0;
        color: #0f172a;
        font-size: 1.05rem;
        font-weight: 800;
    }
    .mod-meta {
        margin: 6px 0 10px;
        color: #64748b;
        font-size: 0.84rem;
    }
    .mod-content {
        color: #334155;
        line-height: 1.45;
        white-space: pre-wrap;
    }
    .mod-attachment {
        margin-top: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        overflow: hidden;
    }
    .mod-attachment img {
        display: block;
        width: 100%;
        max-height: 360px;
        object-fit: cover;
    }
    .mod-file {
        padding: 10px 12px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
    }
    .mod-file a {
        color: #0f172a;
        text-decoration: none;
        font-weight: 700;
    }
    .mod-actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
    }
    .mod-btn.approve {
        border-color: #10b981;
        color: #065f46;
        background: #ecfdf5;
    }
    .mod-btn.reject {
        border-color: #fca5a5;
        color: #991b1b;
        background: #fef2f2;
    }
    .mod-empty {
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 8px;
        padding: 22px;
        text-align: center;
        color: #64748b;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="mod-wrap">
    <div class="mod-head">
        <div>
            <h1 class="mod-title">Moderasyon</h1>
            <p class="mod-sub">Onay bekleyen gönderileri buradan yönet.</p>
        </div>
        <button class="mod-btn" type="button" onclick="loadPendingPosts()">Yenile</button>
    </div>
    <div id="modStatus" class="mod-sub" style="margin-bottom:10px;"></div>
    <div id="pendingList" class="mod-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function esc(raw) {
        return String(raw || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
    }

    function renderAttachment(att) {
        if (!att || !att.url) return "";
        const safeUrl = esc(att.url);
        const safeName = esc(att.name || "Ek");
        if (att.kind === "image" || att.kind === "gif") {
            return `<div class="mod-attachment"><img src="${safeUrl}" alt="${safeName}" loading="lazy"></div>`;
        }
        return `<div class="mod-attachment mod-file"><i class="far fa-file"></i><a href="${safeUrl}" target="_blank" rel="noopener" download>${safeName}</a></div>`;
    }

    function renderPending(posts) {
        const list = document.getElementById("pendingList");
        if (!list) return;
        if (!Array.isArray(posts) || posts.length === 0) {
            list.innerHTML = `<div class="mod-empty">Bekleyen gönderi yok.</div>`;
            return;
        }
        list.innerHTML = posts.map((p) => `
            <div class="mod-card">
                <h3 class="mod-post-title">${esc(p.title || "Başlık yok")}</h3>
                <div class="mod-meta">@${esc(p.author.username || "kullanıcı")} - ${new Date(p.created_at).toLocaleString()}</div>
                <div class="mod-content">${esc(p.content || "")}</div>
                ${renderAttachment(p.attachment)}
                <div class="mod-actions">
                    <button class="mod-btn approve" type="button" onclick="approvePost(${Number(p.id)})">Onayla</button>
                    <button class="mod-btn reject" type="button" onclick="rejectPost(${Number(p.id)})">Reddet</button>
                </div>
            </div>
        `).join("");
    }

    async function loadPendingPosts() {
        const status = document.getElementById("modStatus");
        if (status) status.innerText = "Yükleniyor...";
        const resp = await fetch("/api/forum/mod/pending");
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            if (status) status.innerText = data.message || "Bekleyen gönderiler alınamadı.";
            renderPending([]);
            return;
        }
        if (status) status.innerText = `${Number(data.count || 0)} adet bekleyen gönderi var.`;
        renderPending(data.posts || []);
    }

    async function approvePost(postId) {
        const resp = await fetch(`/api/forum/mod/post/${postId}/approve`, { method: "POST" });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            alert(data.message || "Onay işlemi başarısız.");
            return;
        }
        await loadPendingPosts();
    }

    async function rejectPost(postId) {
        const note = prompt("Red notu (opsiyonel):", "") || "";
        const resp = await fetch(`/api/forum/mod/post/${postId}/reject`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ note })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            alert(data.message || "Red işlemi başarısız.");
            return;
        }
        await loadPendingPosts();
    }

    loadPendingPosts();
</script>
{% endblock %}
