<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-ACCESS | {% block title %}Panel{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #064e3b;       /* Derin Zümrüt */
            --accent: #d97706;        /* Altın */
            --glass-green: rgba(6, 78, 59, 0.85); 
            --text-dark: #111827;
            --sidebar-width: 300px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            background-color: #f3f4f6;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        /* --- 1. TOP BAR (GÜNCELLENDİ) --- */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 80px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 1000;
            background: transparent; /* Başlangıçta şeffaf */
            border-bottom: 1px solid transparent;
            transition: all 0.4s ease; /* Yumuşak geçiş efekti */
        }

        /* Kaydırınca aktif olan stil */
        .top-bar.scrolled {
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Logo ve Menü Butonu Renkleri - Şeffafken Beyaz, Kaydırınca Yeşil */
        .menu-btn, .logo-text {
            color: white; 
            transition: color 0.4s;
        }

        .top-bar.scrolled .menu-btn, 
        .top-bar.scrolled .logo-text {
            color: var(--primary);
        }

        /* --- 2. SIDEBAR --- */
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
            z-index: 1001; opacity: 0; pointer-events: none; transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; left: -340px; 
            width: var(--sidebar-width); height: 100vh;
            background: linear-gradient(180deg, #022c22 0%, #064e3b 100%);
            z-index: 1002; padding: 40px 30px;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            color: white; box-shadow: 10px 0 40px rgba(0,0,0,0.4);
        }
        .sidebar.active { left: 0; }

        .brand { font-size: 1.8rem; color: #d1fae5; margin-bottom: 50px; display: flex; align-items: center; gap: 10px; }
        
        .nav-item {
            display: flex; align-items: center; gap: 15px;
            padding: 16px 20px; color: rgba(255,255,255,0.7);
            text-decoration: none; border-radius: 12px; margin-bottom: 5px;
            font-weight: 500; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }

        /* --- 3. UI ELEMENTS --- */
        .top-left {
            display: flex;
            align-items: center;
            gap: 20px;
            min-width: 0;
        }
        .menu-btn {
            background: transparent; border: none;
            font-size: 1.5rem; cursor: pointer; padding: 10px; 
            border-radius: 50%; transition: 0.3s;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.1); }
        .top-bar.scrolled .menu-btn:hover { background: rgba(0,0,0,0.05); }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .user-chip {
            display: flex; align-items: center; gap: 15px;
            background: rgba(255, 255, 255, 0.2); /* Şeffafken daha hafif görünümlü */
            padding: 6px 6px 6px 20px;
            border-radius: 50px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s;
            color: white;
        }
        .top-bar.scrolled .user-chip {
            background: white;
            color: var(--text-dark);
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .user-chip:hover { transform: translateY(-2px); }
        .user-meta {
            text-align: right;
            line-height: 1.2;
        }
        .user-title {
            font-weight: 700;
            font-size: 0.9rem;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-subtitle {
            font-size: 0.75rem;
            opacity: 0.8;
        }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--accent); background-size: cover; background-position: center;
        }

        .main-content { width: 100%; min-height: 100vh; }
        .main-content.with-offset { padding-top: 120px; }
        body.page-settings .main-content.with-offset { padding-top: 136px; }
        body.page-calc .main-content.with-offset { padding-top: 124px; }

        /* --- AI CHAT STYLES --- */
        #aiLauncher {
            position: fixed; bottom: 30px; right: 30px;
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(6, 78, 59, 0.4);
            cursor: pointer; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #aiLauncher i { color: white; font-size: 1.8rem; }

        #aiWindow {
            position: fixed; bottom: 110px; right: 30px;
            width: 380px; height: 600px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 9999;
            display: none; flex-direction: column; overflow: hidden;
            animation: openChat 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .notification-dot {
            position: absolute;
            top: 9px;
            right: 8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #ecfdf5;
        }

        .chat-header {
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
            color: #fff;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-body {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .msg {
            margin-bottom: 10px;
            padding: 11px 13px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.45;
            font-size: 0.92rem;
        }

        .msg-ai {
            background: #ffffff;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-top-left-radius: 4px;
        }

        .msg-user {
            margin-left: auto;
            background: #064e3b;
            color: #ffffff;
            border-top-right-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
        }

        .chat-input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 0.92rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #064e3b;
            color: #ffffff;
            cursor: pointer;
        }

        .send-btn:hover { background: #043f30; }

        @keyframes openChat {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        body.sidebar-open {
            overflow: hidden;
            touch-action: none;
        }

        @media (max-width: 1100px) {
            :root { --sidebar-width: min(320px, 86vw); }
            .top-bar {
                height: 72px;
                padding: 0 18px;
            }
            .main-content.with-offset { padding-top: 104px; }
            body.page-settings .main-content.with-offset { padding-top: 112px; }
            body.page-calc .main-content.with-offset { padding-top: 108px; }
            #aiLauncher {
                width: 58px;
                height: 58px;
                right: 18px;
                bottom: 18px;
            }
            #aiLauncher i { font-size: 1.5rem; }
            #aiWindow {
                right: 16px;
                bottom: 88px;
                width: min(420px, calc(100vw - 32px));
                height: min(72vh, 560px);
            }
        }

        @media (max-width: 768px) {
            .top-bar {
                height: 66px;
                padding: 0 12px;
            }
            .top-left { gap: 10px; }
            .menu-btn {
                font-size: 1.2rem;
                padding: 8px;
            }
            .logo-text {
                font-size: 1rem;
                letter-spacing: 0.4px;
            }
            .user-chip {
                gap: 8px;
                padding: 4px 5px 4px 10px;
                border-radius: 999px;
            }
            .user-title {
                max-width: 96px;
                font-size: 0.82rem;
            }
            .user-subtitle { font-size: 0.68rem; }
            .user-avatar {
                width: 36px;
                height: 36px;
            }
            .main-content.with-offset { padding-top: 90px; }
            body.page-settings .main-content.with-offset { padding-top: 98px; }
            body.page-calc .main-content.with-offset { padding-top: 94px; }
            .sidebar {
                left: calc(var(--sidebar-width) * -1 - 20px);
                padding: 20px 18px;
            }
            .brand {
                font-size: 1.35rem;
                margin-bottom: 26px;
            }
            .nav-item {
                padding: 13px 14px;
                gap: 12px;
                font-size: 0.95rem;
            }
            #aiLauncher {
                width: 54px;
                height: 54px;
                right: 12px;
                bottom: 12px;
            }
            #aiWindow {
                right: 9px;
                bottom: 74px;
                width: calc(100vw - 18px);
                height: min(70vh, 520px);
                border-radius: 16px;
            }
            .chat-header { padding: 12px 14px; }
            .chat-body { padding: 10px; }
            .chat-input-area { padding: 9px; }
        }

        @media (max-width: 520px) {
            .user-subtitle { display: none; }
            .user-title { max-width: 72px; }
            .logo-text { font-size: 0.94rem; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="page-{{ page|default('unknown') }}">

    <header class="top-bar {% if page != 'home' %}scrolled{% endif %}" id="topBar">
        <div class="top-left">
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="logo-text">ECO-ACCESS</div>
        </div>

        <a href="/dashboard/profile" class="user-chip" style="text-decoration:none;">
            <div class="user-meta">
                <div id="topNickname" class="user-title">...</div>
                <div class="user-subtitle">Profilim</div>
            </div>
            <div id="topAvatar" class="user-avatar"></div>
        </a>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="fas fa-leaf"></i> ECO-ACCESS</div>
        <a href="/dashboard/home" class="nav-item {% if page == 'home' %}active{% endif %}"><i class="fas fa-home"></i> Ana Sayfa</a>
        <a href="/dashboard/social" class="nav-item {% if page == 'social' or page == 'forum' %}active{% endif %}"><i class="fas fa-comments"></i> Sosyal</a>
        <a href="/dashboard/calc" class="nav-item {% if page == 'calc' %}active{% endif %}"><i class="fas fa-calculator"></i> Hesaplama</a>
        <a href="/dashboard/edu" class="nav-item {% if page == 'edu' %}active{% endif %}"><i class="fas fa-graduation-cap"></i> Akademi</a>
        <a href="/dashboard/settings" class="nav-item {% if page == 'settings' %}active{% endif %}"><i class="fas fa-cog"></i> Ayarlar</a>
        <a id="navModeration" href="/dashboard/moderation" class="nav-item {% if page == 'moderation' %}active{% endif %}" style="display:none;"><i class="fas fa-shield-halved"></i> Moderasyon</a>
        <a id="navAdmin" href="/dashboard/admin" class="nav-item {% if page == 'admin' %}active{% endif %}" style="display:none;"><i class="fas fa-user-gear"></i> Yönetici İşlemleri</a>
        <div style="margin-top:auto;"><div class="nav-item" style="color:#fca5a5; cursor: pointer;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</div></div>
    </aside>

    <main class="main-content {% if page != 'home' %}with-offset{% endif %}">
    {% block content %}{% endblock %}
    </main>

    <div id="aiLauncher" onclick="toggleChat()"><i class="fas fa-robot"></i><span class="notification-dot"></span></div>
    <div id="aiWindow">
        <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 50%; display: grid; place-items: center;"><i class="fas fa-robot" style="font-size: 0.9rem;"></i></div>
                <div><div style="font-weight: 700; font-size: 1rem; line-height: 1;">Eco-Asistan</div><div style="font-size: 0.75rem; opacity: 0.8; margin-top: 2px;">Çevrimiçi</div></div>
            </div>
            <i class="fas fa-times" style="cursor: pointer; opacity: 0.8; font-size: 1.2rem;" onclick="toggleChat()"></i>
        </div>
        <div id="chatMessages" class="chat-body"><div class="msg msg-ai">Merhaba! 👋 Ben kişisel karbon danışmanınızım.</div></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" class="chat-input" placeholder="Bir şeyler sorun..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // Kaydırma Takibi (Scrolled Sınıfı Ekleme)
        const keepScrolled = {{ 'true' if page != 'home' else 'false' }};
        const MOBILE_MAX = 768;
        const TABLET_MAX = 1100;

        function getDeviceType() {
            const w = window.innerWidth || document.documentElement.clientWidth || 1200;
            const ua = navigator.userAgent || "";
            const isMobileUA = /Mobi|Android|iPhone|iPod|Windows Phone/i.test(ua);
            const isTabletUA = /iPad|Tablet|PlayBook|Silk/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua));
            if (isMobileUA && w <= 1024) return 'mobile';
            if (isTabletUA && w <= 1366) return 'tablet';
            if (w <= MOBILE_MAX) return 'mobile';
            if (w <= TABLET_MAX) return 'tablet';
            return 'desktop';
        }

        function applyDeviceClass() {
            const type = getDeviceType();
            document.body.classList.remove('device-mobile', 'device-tablet', 'device-desktop');
            document.body.classList.add(`device-${type}`);
            document.body.dataset.device = type;
            if (type === 'desktop') {
                closeSidebar(true);
            }
        }

        function syncTopBarState() {
            const bar = document.getElementById('topBar');
            if (!bar) return;
            if (keepScrolled || window.scrollY > 50 || document.body.classList.contains('device-mobile')) {
                bar.classList.add('scrolled');
            } else {
                bar.classList.remove('scrolled');
            }
        }

        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        function resetViewportTop() {
            if (!keepScrolled) return;
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
                active.blur();
            }
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            window.scrollTo(0, 0);
        }

        window.addEventListener('scroll', syncTopBarState);
        window.addEventListener('load', function() {
            applyDeviceClass();
            resetViewportTop();
            requestAnimationFrame(resetViewportTop);
            setTimeout(resetViewportTop, 80);
            setTimeout(resetViewportTop, 180);
            syncTopBarState();
        });
        window.addEventListener('pageshow', function() {
            applyDeviceClass();
            resetViewportTop();
            setTimeout(resetViewportTop, 80);
            syncTopBarState();
        });
        window.addEventListener('resize', function() {
            applyDeviceClass();
            syncTopBarState();
        });
        window.addEventListener('orientationchange', function() {
            applyDeviceClass();
            syncTopBarState();
        });

        function closeSidebar(silent = false) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar || !overlay) return;
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.classList.remove('sidebar-open');
            if (!silent) syncTopBarState();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar || !overlay) return;
            const willOpen = !sidebar.classList.contains('active');
            sidebar.classList.toggle('active', willOpen);
            overlay.classList.toggle('active', willOpen);
            document.body.classList.toggle('sidebar-open', willOpen);
        }

        async function logout() { await fetch("/logout", { method: "POST" }); window.location.href = "/"; }

        document.querySelectorAll('.sidebar a.nav-item[href]').forEach((el) => {
            el.addEventListener('click', () => closeSidebar(true));
        });

        let isChatOpen = false;
        function toggleChat() {
            isChatOpen = !isChatOpen;
            const win = document.getElementById('aiWindow');
            const launcher = document.getElementById('aiLauncher');
            if (isChatOpen) { win.style.display = 'flex'; launcher.style.transform = 'scale(0)'; setTimeout(() => document.getElementById('chatInput').focus(), 100); }
            else { win.style.display = 'none'; launcher.style.transform = 'scale(1)'; }
        }

        function addMessage(text, sender) {
            const chatArea = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `msg msg-${sender}`;
            div.innerText = text || ""; 
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if (!txt) return;
            addMessage(txt, 'user');
            input.value = "";
            try {
                const resp = await fetch("/api/ai-chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: txt }) });
                const data = await resp.json();
                addMessage(data.response, 'ai');
            } catch (err) { addMessage("Bağlantı hatası.", 'ai'); }
        }

        (async function boot() {
            try {
                const resp = await fetch("/auth/me");
                const user = await resp.json();
                if (user.logged_in) {
                    document.getElementById("topNickname").innerText = user.display_name || user.nickname || user.username;
                    if(user.avatar_url) {
                        document.getElementById("topAvatar").style.backgroundImage = `url('${user.avatar_url}')`;
                        document.getElementById("topAvatar").innerText = "";
                    }
                    const modLink = document.getElementById("navModeration");
                    const adminLink = document.getElementById("navAdmin");
                    if (modLink && user.is_moderator) modLink.style.display = "flex";
                    if (adminLink && user.is_owner) adminLink.style.display = "flex";
                }
            } catch (err) {}
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
