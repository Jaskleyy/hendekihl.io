services:
  - type: web
    name: eco-access
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ECO_DEV_HOT_RELOAD
        value: "0"
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eco-access-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat
      - key: ECO_OWNER_USERNAME
        value: eymen
      - key: ECO_OWNER_PASSWORD
        sync: false

databases:
  - name: eco-access-db
    databaseName: eco_access
    user: eco_access
    plan: free
